name: OmniCode Continuous Integration & Deployment

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  test-studio-and-core:
    name: Studio Frontend & Core Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Build Core Package
        run: npm run build --prefix packages/core

      - name: Run Studio & Core Test Suite
        run: npm test


      - name: Build Studio Application
        run: npm run build

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  test-api:
    name: REST API Microservice Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Build Core Dependency
        run: npx tsc -p packages/core/tsconfig.json

      - name: Install API Dependencies
        run: |
          cd packages/api
          npm ci

      - name: Run API Integration Tests
        run: |
          cd packages/api
          npm test

  test-php:
    name: PHP & Laravel Packages (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.2', '8.3']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, iconv
          tools: composer:v2

      - name: Test Pure PHP Package
        run: |
          cd packages/php
          composer install --no-interaction --prefer-dist
          ./vendor/bin/phpunit

      - name: Test Laravel Package
        run: |
          cd packages/laravel
          composer config repositories.local '{"type": "path", "url": "../php", "options": {"versions": {"omnicode/omnicode-php": "1.0.0"}}}'
          composer install --no-interaction --prefer-dist
          ./vendor/bin/phpunit

  docker-smoke:
    name: Docker Container Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build API Docker Image
        run: docker build -t omnicode-api -f packages/api/Dockerfile .

      - name: Run Container and Verify End-to-End Code Generation
        run: |
          docker run -d --name api-smoke -p 8080:8080 -e API_KEY=docker-smoke-secret omnicode-api
          sleep 4

          # 1. Health & Security Headers
          curl --fail -i http://localhost:8080/health | grep -i "x-content-type-options: nosniff" || (docker logs api-smoke && exit 1)

          # 2. Telemetry & Metrics
          curl --fail http://localhost:8080/metrics | grep '"status":"ok"' || (docker logs api-smoke && exit 1)

          # 3. QR Code Generation
          QR_RES=$(curl -s -X POST http://localhost:8080/api/v1/qr/generate \
            -H "Content-Type: application/json" \
            -H "x-api-key: docker-smoke-secret" \
            -d '{"data":"https://omnicode.studio/docker-verified","ecLevel":"H","dotType":"rounded"}')
          echo "$QR_RES" | grep '"success":true' || (echo "QR generation failed: $QR_RES" && docker logs api-smoke && exit 1)

          # 4. Barcode CODE128 Generation
          BC_RES=$(curl -s -X POST http://localhost:8080/api/v1/barcode/generate \
            -H "Content-Type: application/json" \
            -H "x-api-key: docker-smoke-secret" \
            -d '{"format":"CODE128","data":"CONTAINER-TEST-99","style":"thermal-label"}')
          echo "$BC_RES" | grep '"success":true' || (echo "Barcode Code128 failed: $BC_RES" && docker logs api-smoke && exit 1)

          # 5. Barcode MSI Generation
          MSI_RES=$(curl -s -X POST http://localhost:8080/api/v1/barcode/generate \
            -H "Content-Type: application/json" \
            -H "x-api-key: docker-smoke-secret" \
            -d '{"format":"MSI","data":"1234567890","style":"minimal"}')
          echo "$MSI_RES" | grep '"success":true' || (echo "Barcode MSI failed: $MSI_RES" && docker logs api-smoke && exit 1)

          # 6. Barcode Codabar Generation
          CB_RES=$(curl -s -X POST http://localhost:8080/api/v1/barcode/generate \
            -H "Content-Type: application/json" \
            -H "x-api-key: docker-smoke-secret" \
            -d '{"format":"codabar","data":"A98765B","style":"classic"}')
          echo "$CB_RES" | grep '"success":true' || (echo "Barcode Codabar failed: $CB_RES" && docker logs api-smoke && exit 1)

          # 7. API Key Protection Verification
          UNAUTH_HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/api/v1/qr/generate \
            -H "Content-Type: application/json" \
            -d '{"data":"test"}')
          if [ "$UNAUTH_HTTP" != "401" ]; then
            echo "Expected HTTP 401 for unauthenticated request, got $UNAUTH_HTTP"
            docker logs api-smoke
            exit 1
          fi

          # 8. Batch Generation Verification
          BATCH_RES=$(curl -s -X POST http://localhost:8080/api/v1/generate/batch \
            -H "Content-Type: application/json" \
            -H "x-api-key: docker-smoke-secret" \
            -d '{"items":[{"type":"qr","options":{"data":"https://batch.test"}},{"type":"barcode","options":{"format":"CODE128","data":"BATCH-123"}}]}')
          echo "$BATCH_RES" | grep '"count":2' || (echo "Batch generation failed: $BATCH_RES" && docker logs api-smoke && exit 1)

          docker stop api-smoke


  deploy-pages:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [test-studio-and-core, test-api, test-php, docker-smoke]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-packages:
    name: Publish GitHub Packages (GHCR & NPM)
    runs-on: ubuntu-latest
    needs: [test-studio-and-core, test-api, test-php, docker-smoke]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/omnicode-api:latest
            ghcr.io/${{ github.repository_owner }}/omnicode-api:v1.1.0
            ghcr.io/${{ github.repository_owner }}/omnicode-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/omnicode-studio-api:latest

      - name: Setup Node.js 22 for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@seotarek'

      - name: Publish NPM Package to GitHub Packages
        run: |
          cd packages/core
          npm ci
          npm run build
          npm publish || echo "Package version may already be published"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-release:
    name: Create GitHub Release & Distribution Bundles
    runs-on: ubuntu-latest
    needs: [publish-packages, deploy-pages]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web Studio Dist
        run: |
          npm ci
          npm run build

      - name: Assemble Release Assets
        run: |
          mkdir -p release-assets

          # 1. Web Studio static build
          cd dist && zip -r ../release-assets/omnicode-studio-web-v1.1.0.zip . && cd ..

          # 2. NPM package tarball
          cd packages/core
          npm pack
          mv seotarek-omnicode-core-*.tgz ../../release-assets/omnicode-core-v1.1.0.tgz
          cd ../..

          # 3. Pure PHP SDK zip
          zip -r release-assets/omnicode-php-v1.1.0.zip packages/php -x "packages/php/vendor/*"

          # 4. Laravel package zip
          zip -r release-assets/omnicode-laravel-v1.1.0.zip packages/laravel -x "packages/laravel/vendor/*"

          # 5. Checksums
          cd release-assets
          sha256sum omnicode-studio-web-v1.1.0.zip omnicode-core-v1.1.0.tgz omnicode-php-v1.1.0.zip omnicode-laravel-v1.1.0.zip > checksums-v1.1.0.txt
          cd ..

      - name: Publish or Update GitHub Release v1.1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.1.0"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Updating existing release $TAG_NAME..."
            gh release edit "$TAG_NAME" --title "OmniCode Studio v1.1.0 — Enterprise Barcode & QR Ecosystem" --notes-file RELEASE_NOTES.md
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" release-assets/* \
              --title "OmniCode Studio v1.1.0 — Enterprise Barcode & QR Ecosystem" \
              --notes-file RELEASE_NOTES.md \
              --target main
          fi
