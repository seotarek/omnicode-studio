name: OmniCode Continuous Integration & Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  test-studio-and-core:
    name: Studio Frontend & Core Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Build Core Package
        run: |
          cd packages/core
          npm ci
          npm run build

      - name: Run Studio & Core Test Suite
        run: npm test

      - name: Build Studio Application
        run: npm run build

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  test-api:
    name: REST API Microservice Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Core Dependency
        run: |
          cd packages/core
          npm ci
          npm run build

      - name: Install API Dependencies
        run: |
          cd packages/api
          npm ci

      - name: Run API Integration Tests
        run: |
          cd packages/api
          npm test

  test-php:
    name: PHP & Laravel Packages (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.2', '8.3']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, iconv
          tools: composer:v2

      - name: Test Pure PHP Package
        run: |
          cd packages/php
          composer install --no-interaction --prefer-dist
          ./vendor/bin/phpunit

      - name: Test Laravel Package
        run: |
          cd packages/laravel
          composer install --no-interaction --prefer-dist
          ./vendor/bin/phpunit

  docker-smoke:
    name: Docker Container Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build API Docker Image
        run: docker build -t omnicode-api -f packages/api/Dockerfile .

      - name: Run Container and Verify Health Endpoint
        run: |
          docker run -d --name api-smoke -p 8080:8080 omnicode-api
          sleep 4
          curl --fail http://localhost:8080/health || (docker logs api-smoke && exit 1)
          docker stop api-smoke

  deploy-pages:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [test-studio-and-core, test-api, test-php, docker-smoke]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
