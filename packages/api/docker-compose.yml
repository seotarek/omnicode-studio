version: "3.8"

services:
  omnicode-api:
    build:
      context: ../../
      dockerfile: packages/api/Dockerfile
    container_name: omnicode-rest-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
